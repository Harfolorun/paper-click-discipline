#stage > *, .abs{position:absolute}
.layer{left:0;top:0;width:100%;height:100%;pointer-events:none}
.txt{white-space:nowrap;line-height:1;opacity:.965}
.r{text-align:right}
.hidden{display:none !important}
img{display:block;-webkit-user-drag:none}

/* options */
.opt{cursor:pointer;text-align:right;font-weight:500;white-space:nowrap;line-height:1;opacity:.965}
.opt.sel{font-weight:900}
.opt .tri{position:absolute;top:50%;right:calc(var(--u)*-22);transform:translateY(-40%);width:0;height:0;
  border-top:calc(var(--u)*6.5) solid transparent;border-bottom:calc(var(--u)*6.5) solid transparent;border-right:calc(var(--u)*10) solid var(--ink);display:none}
.opt.sel .tri{display:block}
.opt:hover{text-decoration:underline;text-decoration-thickness:calc(var(--u)*1.5);text-underline-offset:calc(var(--u)*5)}

/* buttons (paper art) */
.btn{cursor:pointer;transition:transform .06s, opacity .25s}
.btn img{width:100%;height:100%}
.btn:hover{filter:brightness(.93)}
.btn:active{transform:translateY(calc(var(--u)*2))}
.btn .num{position:absolute;text-align:center;font-weight:700;line-height:1;color:#73233e;white-space:nowrap}
.btn.off{opacity:.3;pointer-events:none}
#bpmIn{background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-weight:500;padding:0;line-height:1;opacity:.965}
#bpmIn::-webkit-inner-spin-button,#bpmIn::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#bpmIn{-moz-appearance:textfield}

/* target + click marks */
#volRow{display:flex;align-items:center;gap:calc(var(--u)*8)}
#volIcon{flex:none;width:calc(var(--u)*33);height:calc(var(--u)*33);color:var(--ink);opacity:.9}
#vol{-webkit-appearance:none;appearance:none;flex:1 1 0;min-width:0;width:0;height:calc(var(--u)*22);background:transparent;margin:0;cursor:pointer}
#vol::-webkit-slider-runnable-track{height:calc(var(--u)*3);background:var(--ink);border-radius:calc(var(--u)*2);opacity:.85}
#vol::-moz-range-track{height:calc(var(--u)*3);background:var(--ink);border-radius:calc(var(--u)*2)}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:calc(var(--u)*15);height:calc(var(--u)*15);border-radius:50%;background:var(--ink);margin-top:calc(var(--u)*-6);border:0}
#vol::-moz-range-thumb{width:calc(var(--u)*15);height:calc(var(--u)*15);border-radius:50%;background:var(--ink);border:0}
#target{pointer-events:none;background:center/100% 100% no-repeat}
.mark{position:absolute;pointer-events:none;animation:fade 1s linear forwards;line-height:1;font-weight:800;white-space:nowrap}
.mark .sym{position:absolute;transform:translate(-50%,-50%)}
.mark .num{position:absolute;transform:translate(0,-50%)}
@keyframes fade{from{opacity:1}to{opacity:0}}
#stage.playing{cursor:default}
</style>
</head>

function text(el, x, base, size, right, w){
  w = w || 700;
  el.style.fontSize = U(size);
  box(el, right ? x - w : x, base - ASC*size, w, size);
}

const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const evTime = e => { const n = performance.now(), t = e.timeStamp; return (t > 0 && Math.abs(n - t) < 1000) ? t : n; };
const fmtMult = m => 'x' + (+m.toFixed(2));

/* ================= metronome sounds (generated) ================= */
let actx = null, noise = null, master = null;
const LATENCY_HINT = 0.05;
const LOOKAHEAD = 500;       // ms: clicks are handed to the audio engine this far ahead of time   // ask for a fixed ~50 ms buffer: a bit more delay, but steadier; calibration absorbs it
function audio(){
  if(!actx){
    try{ actx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: LATENCY_HINT }); }
    catch(e){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e2){ actx = null; } }
    if(actx){
      master = actx.createGain(); master.gain.value = volGain(); master.connect(actx.destination);
      noise = actx.createBuffer(1, Math.round(actx.sampleRate*.06), actx.sampleRate); const d = noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      // keep-alive: an inaudible signal (about -94 dB) so the audio device never goes to sleep between sounds
      try{ const k = actx.createConstantSource(); k.offset.value = 0.00002; k.connect(actx.destination); k.start(); }catch(e){}
      requestAnimationFrame(clockLoop);
    }
  }
  if(actx && actx.state === 'suspended') actx.resume().catch(()=>{});
  return actx;
}
// warm the audio up on the very first click anywhere, so it is settled before a game or calibration
addEventListener('pointerdown', () => audio(), { once: true, capture: true });

/* ---- audio clock <-> page clock mapping ----
   Each frame we sample the pair (page time, audio time). The browser's own matched pair (getOutputTimestamp)
   is used when it works; otherwise currentTime, which only updates in steps, so we take the low edge of the steps.
   The smoothed offset is then used to place every metronome click on the audio clock. */
const CK = { raw: [], useOut: null, off: null, hist: [] };
function clockSample(){
  const a = actx; if(!a || a.state !== 'running') return;
  let off = null, out = null;
  if(CK.useOut !== false && a.getOutputTimestamp){
    const ts = a.getOutputTimestamp();
    if(ts && ts.performanceTime > 0 && ts.contextTime > 0) out = ts.performanceTime - ts.contextTime*1000;
  }
  if(CK.useOut == null && CK.raw.length > 30) CK.useOut = CK.raw.filter(r => r.out != null).length > 25;   // decide once
  off = CK.useOut ? out : performance.now() - a.currentTime*1000;
  if(off == null) off = performance.now() - a.currentTime*1000;
  CK.raw.push({ t: performance.now(), off, out });
  if(CK.raw.length > 120) CK.raw.shift();
  const offs = CK.raw.slice(-60).map(r => r.off);
  const est = CK.useOut ? median(offs) : Math.min(...offs);
  // a sudden big change (device switch, wake-up) resets the estimate instead of averaging into it
  if(CK.off != null && Math.abs(est - CK.off) > 25){ CK.raw = CK.raw.slice(-1); CK.off = off; CK.hist = []; }
  else CK.off = CK.off == null ? est : CK.off + (est - CK.off)*0.2;
  if(CK.useOut != null) CK.hist.push({ t: performance.now(), off: CK.off });
  while(CK.hist.length && CK.hist[0].t < performance.now() - 10000) CK.hist.shift();
}
function clockLoop(){ clockSample(); if(DBG.on) drawDebug(); requestAnimationFrame(clockLoop); }
function perfToAudio(perfMs){
  const a = actx;
  if(CK.off == null) return a.currentTime + (perfMs - performance.now())/1000;
  return (perfMs - CK.off)/1000;
}

/* ---- hidden debug readout: press D ---- */
const DBG = { on: false, late: 0, scheduled: 0, el: null };
function drawDebug(){
  if(!DBG.el){ DBG.el = document.createElement('div'); DBG.el.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:20;background:rgba(20,24,40,.85);color:#e6edf3;font:12px/1.5 ui-monospace,Consolas,monospace;padding:8px 10px;border-radius:6px;pointer-events:none;white-space:pre'; document.body.append(DBG.el); }
  const a = actx, f = v => v == null || isNaN(v) ? '–' : v.toFixed(1);
  let txt = 'Audio debug (D to hide)\n';
  if(!a){ txt += 'audio not started yet — click anywhere'; DBG.el.textContent = txt; return; }
  const recent = CK.raw.slice(-60).map(r => r.off), sdv = recent.length > 2 ? Math.sqrt(mean(recent.map(x => (x - mean(recent))**2))) : NaN;
  const drift = CK.hist.length > 1 ? CK.hist[CK.hist.length-1].off - CK.hist[0].off : NaN;
  txt += 'state        ' + a.state + ' · ' + a.sampleRate + ' Hz\n';
  txt += 'clock source ' + (CK.useOut == null ? 'measuring…' : CK.useOut ? 'output timestamp' : 'currentTime (fallback)') + '\n';
  txt += 'base latency ' + f(a.baseLatency*1000) + ' ms   output latency ' + f(a.outputLatency*1000) + ' ms\n';
  txt += 'raw clock jitter ±' + f(sdv) + ' ms (smoothed away)\n';
  txt += 'offset drift, last 10 s  ' + f(drift) + ' ms\n';
  txt += 'clicks scheduled ' + DBG.scheduled + '   too late ' + DBG.late + '\n';
  txt += 'calibration ' + (S.calib == null ? 'not done' : f(S.calib) + ' ms');
  DBG.el.textContent = txt;
}

const BUF = {};
// Decode the sounds as soon as the page opens (an offline context needs no click), so the very first
// click already plays the recordings instead of the generated fallback.
let samplesReady = Promise.resolve();
function loadSamples(){
  if(loadSamples.started) return samplesReady;
  loadSamples.started = true;
  let dec;
  try{ dec = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 1, 44100); }catch(e){ dec = actx; }
  if(!dec) return samplesReady;
  const jobs = [];
  Object.entries(SAMPLES).forEach(([name, uris]) => uris.forEach((u, i) => {
    const bin = atob(u.split(',')[1]), arr = new Uint8Array(bin.length);
    for(let j=0;j<bin.length;j++) arr[j] = bin.charCodeAt(j);
    jobs.push(dec.decodeAudioData(arr.buffer).then(b => { (BUF[name] = BUF[name] || [])[i] = b; }).catch(()=>{}));

loadSamples();
function env(g, t, peak, dur){ g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + 0.001); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function noiseHit(t, type, freq, q, peak, dur){
  const a = actx, n = a.createBufferSource(); n.buffer = noise;

  const g = a.createGain(); env(g, t, peak, dur);
  n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + 0.06);
}
function tone(t, type, f0, f1, peak, dur){
  const a = actx, o = a.createOscillator(), g = a.createGain();

function clickAt(perfMs, beat){
  const a = actx; if(!a) return;
  let t = perfToAudio(perfMs);
  DBG.scheduled++;
  if(t < a.currentTime - 0.02){ DBG.late++; return; }
  if(t < a.currentTime) DBG.late++;
  t = Math.max(t, a.currentTime);
  const accent = beat % 4 === 0;
  const sm = BUF[S.sound] && BUF[S.sound][beat % 2 === 0 ? 0 : 1];

/* ================= options ================= */
function syncUI(){
  $$('.opt').forEach(o => {
    const k = o.dataset.k;
    o.classList.toggle('sel', S[k] === o.dataset.v);
  });
  $('#bpmIn').value = S.bpm;
  $('#vol').value = S.vol;
  $('#calVal').textContent = S.calib == null ? '' : (S.calib >= 0 ? '+' : '-') + Math.abs(Math.round(S.calib)) + 'ms';
  $('#hiScore').textContent = best;
  if(!G) $('#streak').textContent = fmtMult(SIZE[S.size].m);
  renderStats();
}
$$('.opt').forEach(o => o.addEventListener('pointerdown', e => {
  if(e.button !== 0) return;
  const k = o.dataset.k;
  S[k] = o.dataset.v;
  saveS(); syncUI();
  if(k === 'sound'){ audio(); samplesReady.then(() => { const t = performance.now() + 50, I = 60000/S.bpm; for(let i=0;i<4;i++) clickAt(t + i*Math.min(I, 500), i); }); }
}));
$('#vol').addEventListener('input', () => { S.vol = +$('#vol').value; saveS(); if(master) master.gain.setTargetAtTime(volGain(), actx.currentTime, 0.01); });
$('#vol').addEventListener('change', () => { audio(); samplesReady.then(() => clickAt(performance.now() + 60, 0)); });
$('#bpmIn').addEventListener('change', () => { S.bpm = Math.round(clamp(+$('#bpmIn').value || 60, 30, 300)); saveS(); syncUI(); });
$('#bpmIn').addEventListener('keydown', e => { if(e.key === 'Enter') $('#bpmIn').blur(); });

/* ================= pages ================= */
let page = 'menu';
function setPage(p){
  page = p;

  $$('.scoreOnly').forEach(e => e.classList.toggle('hidden', p !== 'score'));

/* ================= calibration ================= */
let C = null;
$('#calBtn').addEventListener('pointerdown', e => {
  if(e.button !== 0 || G || C) return;
  e.stopPropagation(); e.preventDefault();
  audio(); if(!actx) return;
  tapReset();
  C = { I: 60000/90, T0: performance.now() + 600, errs: [], next: 0, need: 16 };
  $('#calTip').textContent = 'Listen!';
  requestAnimationFrame(calLoop);
});
function calLoop(){
  if(!C) return;
  const now = performance.now();
  while(C.next < 60 && C.T0 + C.next*C.I < now + LOOKAHEAD){ clickAt(C.T0 + C.next*C.I, C.next); C.next++; }
  if(now > C.T0 + 3.5*C.I && $('#calTip').textContent === 'Listen!'){ $('#calTip').textContent = 'Click to the beat!'; $('#calNum').textContent = C.need; }
  if(now > C.T0 + 60*C.I){ endCalib(false); return; }
  requestAnimationFrame(calLoop);
}
function calClick(t){
  const k = Math.round((t - C.T0)/C.I);
  if(k < 4) return;
  const err = t - (C.T0 + k*C.I);
  if(Math.abs(err) > C.I*0.4) return;
  C.errs.push(err);
  $('#calNum').textContent = C.need - C.errs.length || '';
  if(C.errs.length >= C.need) endCalib(true);
}
function endCalib(ok){
  if(ok){ S.calib = median(C.errs.slice(2)); saveS(); }
  C = null; $('#calTip').textContent = ''; $('#calNum').textContent = ''; syncUI();
  // 3 s cool-down so extra clicks (e.g. with eyes closed) don't restart syncing
  const cb = $('#calBtn'); cb.classList.add('off'); clearTimeout(endCalib.t); endCalib.t = setTimeout(() => cb.classList.remove('off'), 3000);
}

/* ================= Play! / Tap! ================= */
let taps = [], lastPos = null;

  if(e.button !== 0 || G || C) return;
  e.preventDefault(); $('#bpmIn').blur();
  audio();

  const I = 60000/S.bpm;

  const anchor = mean(last.map((x, i) => x - i*I));
  S.bpm = bpm; saveS();
  lastPos = toUnits(e);
  startGame(bpm, anchor + TAP_USE*I);       // first scored beat = the next beat after your 10th click
});

/* ================= game ================= */
let G = null;
function startGame(bpm, T0, pre = 0){
  const sz = SIZE[S.size];
  G = { bpm, I: 60000/bpm, T0, win: +S.win, N: Math.round(GAME_SECONDS*bpm/60), r: sz.d/2, sizeM: sz.m,
        res: [], next: -pre, pre, skipPtr: 0, score: 0, streak: 0, tx: 0, ty: 0, done: false,
        clicks: 0, early: 0, perfect: 0, late: 0, onT: 0, over: 0, under: 0, side: 0, misses: 0 };
  G.res = new Array(G.N).fill(null);
  G.top = sz.m;
  tapReset();
  if(!pre) setPage('game');   // with a count-in the main menu stays up until the count-in ends
  $('#target').style.backgroundImage = 'url(' + TARGET_ART[S.size] + ')';
  placeTarget(true);
  updScore();
  if(pre) $('#playLab').textContent = '';
  requestAnimationFrame(frame);
}
const beatT = n => G.T0 + n*G.I;
const mult = () => G.sizeM * (1 + 0.25*Math.floor(G.streak/5));
function placeTarget(first){
  const r = G.r, m = r + 3;
  for(let i=0;i<60;i++){
    const x = FIELD.x0 + m + Math.random()*(FIELD.x1 - FIELD.x0 - 2*m);
    const y = FIELD.y0 + m + Math.random()*(FIELD.y1 - FIELD.y0 - 2*m);
    const inNotch = x + r > NOTCH.x0 && x - r < NOTCH.x1 && y - r < NOTCH.y1;
    if(inNotch) continue;
    if(!first){ const d = Math.hypot(x - G.tx, y - G.ty); if(d < 3*r + 40 || d > 650) continue; }
    G.tx = x; G.ty = y; break;
  }
  box($('#target'), G.tx - r, G.ty - r, 2*r, 2*r);
  $('#target').style.transform = 'rotate(' + (30 * Math.floor(Math.random()*12)) + 'deg)';   // visual variety only
}
function updScore(){
  $('#curScore').textContent = G.score;
  $('#streak').textContent = fmtMult(mult());
}
function mark(x, y, kind, num){
  const el = document.createElement('div'); el.className = 'mark';
  box(el, x, y);
  const col = kind === 'dot' ? 'var(--green)' : 'var(--red)';
  const sym = document.createElement('div'); sym.className = 'sym';
  if(kind === 'dot'){ sym.style.cssText = 'width:'+U(9)+';height:'+U(9)+';border-radius:50%;background:'+col; }
  else if(kind === 'o'){ sym.style.cssText = 'width:'+U(11)+';height:'+U(11)+';border-radius:50%;border:'+U(2.5)+' solid '+col; }
  else { sym.style.cssText = 'width:'+U(13)+';height:'+U(13); sym.innerHTML = '<i></i><i></i>';
    [...sym.children].forEach((bar, i) => bar.style.cssText = 'position:absolute;left:50%;top:50%;width:'+U(15)+';height:'+U(2.6)+';background:'+col+';border-radius:'+U(2)+';transform:translate(-50%,-50%) rotate('+(i ? -45 : 45)+'deg)'); }
  const n = document.createElement('div'); n.className = 'num'; n.textContent = num;
  n.style.cssText = 'color:'+col+';font-size:'+U(20)+';left:'+U(11)+';top:'+U(-1);
  el.append(sym, n); $('#marks').append(el);
  setTimeout(() => el.remove(), 1050);
}
function missDir(p){
  // over/under/side relative to the line from where the cursor came from (last click) to the target
  const o = lastPos || { x:(FIELD.x0+FIELD.x1)/2, y:(FIELD.y0+FIELD.y1)/2 };
  const vx = G.tx - o.x, vy = G.ty - o.y, L = Math.hypot(vx, vy);
  if(L < G.r) return 'side';
  const ux = vx/L, uy = vy/L, wx = p.x - G.tx, wy = p.y - G.ty;
  const along = wx*ux + wy*uy, perp = Math.abs(wx*uy - wy*ux);
  if(perp > Math.abs(along)) return 'side';
  return along > 0 ? 'over' : 'under';
}
function judge(t, p){
  if(t < G.T0 - G.I/2) return;   // stray click well before the first beat
  const n = clamp(Math.round((t - G.T0)/G.I), 0, G.N - 1), err = t - beatT(n);
  const onT = Math.hypot(p.x - G.tx, p.y - G.ty) <= G.r + 1;
  const onTime = Math.abs(err) <= G.win && !G.res[n];
  G.clicks++;
  if(onTime) G.perfect++; else if(err < 0) G.early++; else G.late++;
  if(onT) G.onT++; else { G.misses++; G[missDir(p)]++; }
  const m = mult();
  if(onTime && onT){
    const pts = Math.round(HIT*m);
    G.res[n] = 'hit'; G.score += pts; G.streak++; G.top = Math.max(G.top, mult());
    mark(p.x, p.y, 'dot', '+' + pts);
    lastPos = p; placeTarget(false);
  } else {
    const pen = Math.round(MISS*m);
    if(onTime) G.res[n] = 'miss';
    G.score -= pen; G.streak = 0;
    mark(p.x, p.y, onTime ? 'x' : 'o', onTime ? '-' + pen : (err < 0 ? 'early' : 'late'));
    lastPos = p;
  }
  updScore();
}
function frame(){
  if(!G || G.done) return;
  const now = performance.now();
  while(G.next < G.N && beatT(G.next) - (S.calib || 0) < now + LOOKAHEAD){ clickAt(beatT(G.next) - (S.calib || 0), G.next < 0 ? G.next + 4 : G.next); G.next++; }
  if(G.pre){   // 4, 3, 2, 1 on the Play! button, in time with the count-in clicks
    const j = Math.floor((now - (beatT(-G.pre) - (S.calib || 0))) / G.I);
    // the game field appears half a beat after the 4th count-in click, half a beat before the first scored beat
    if(now >= beatT(-1) - (S.calib || 0) + G.I/2){ G.pre = 0; $('#playLab').textContent = ''; setPage('game'); }
    else { const lab = j < 0 ? '' : String(G.pre - j); if($('#playLab').textContent !== lab) $('#playLab').textContent = lab; }
  }
  while(G.skipPtr < G.N && beatT(G.skipPtr) + G.win < now){
    if(!G.res[G.skipPtr]){ G.res[G.skipPtr] = 'skip'; G.score -= Math.round(MISS*mult()); G.streak = 0; updScore(); }
    G.skipPtr++;
  }
  if(now > beatT(G.N - 1) + Math.max(G.win, G.I/2) + 200){ finish(); return; }
  requestAnimationFrame(frame);
}
function abortGame(){ if(G){ G.done = true; G = null; } $('#playLab').textContent = ''; setPage('menu'); syncUI(); $('#curScore').textContent = 0; }

/* ================= results ================= */
const pct = (a, b) => b ? Math.round(a/b*100) : null;
function finish(){
  G.done = true;
  const r = { t: Date.now(), bpm: G.bpm, size: S.size, win: G.win, score: G.score, top: G.top, clicks: G.clicks, misses: G.misses,
    early: pct(G.early, G.clicks), perfect: pct(G.perfect, G.clicks), late: pct(G.late, G.clicks),
    acc: pct(G.onT, G.clicks), under: pct(G.under, G.misses), over: pct(G.over, G.misses), side: pct(G.side, G.misses) };
  history.push(r); if(history.length > 200) history = history.slice(-200);
  store.set('pcd2.history', history);
  if(r.score > best){ best = r.score; store.set('pcd2.best', best); }
  const show = v => v == null ? '–' : v + '%';
  $$('.sc').forEach(e => { const k = e.dataset.s; e.textContent = k === 'score' ? r.score : k === 'top' ? fmtMult(r.top) : show(r[k]); });
  G = null;
  $('#playLab').textContent = '';
  setPage('score');
  const mb = $('#menuBtn'); mb.classList.add('off'); setTimeout(() => mb.classList.remove('off'), 1000);
  syncUI();
  $('#curScore').textContent = r.score;
}
$('#menuBtn').addEventListener('pointerdown', e => { if(e.button !== 0) return; setPage('menu'); syncUI(); });

function renderStats(){
  const last = history.slice(-10);
  const avg = k => { const v = last.map(h => h[k]).filter(x => x != null); return v.length ? Math.round(mean(v)) + '%' : '–'; };
  $$('.st').forEach(e => e.textContent = avg(e.dataset.s));
}

/* ================= global input ================= */
document.addEventListener('pointerdown', e => {
  if(e.button !== 0) return;
  if(C){ e.preventDefault(); e.stopPropagation(); calClick(evTime(e)); return; }
  if(G && !G.done){ e.preventDefault(); e.stopPropagation(); judge(evTime(e), toUnits(e)); }
}, true);
document.addEventListener('contextmenu', e => { if(G) e.preventDefault(); });
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(G && !G.done) abortGame();
  else if(C) endCalib(false);
});
document.addEventListener('visibilitychange', () => { if(document.hidden){ if(G && !G.done) abortGame(); if(C) endCalib(false); } });

layout(); fit(); setPage('menu'); syncUI();
</script>
</body>
